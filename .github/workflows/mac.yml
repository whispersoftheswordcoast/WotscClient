name: LauncherMac
on:
  push:
    paths:
      - "LauncherMac/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "LauncherMac/**"
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m pytest LauncherMac/tests/ -v

  build-mac:
    needs: logic
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyinstaller requests pillow customtkinter pytest
      - run: python -m pytest LauncherMac/tests/ -v
      - working-directory: LauncherMac
        run: |
          # NOTA: niente --target-arch (l'interprete setup-python e' nativo
          # single-arch; universal2 qui fallirebbe la build).
          python -m PyInstaller --noconfirm --windowed \
            --name WOTSCLauncherMac \
            --osx-bundle-identifier coast.sword.wotsc-launcher-mac \
            --add-data "background.jpg:assets" \
            --add-data "exclude.ini:." \
            --add-data "mac-ignore.ini:." \
            InstallerWotscMac.py
      - run: codesign --deep --force -s - "LauncherMac/dist/WOTSCLauncherMac.app" || true
      - working-directory: LauncherMac/dist
        run: |
          cat > Leggimi-mac.txt <<'EOF'
          WOTSC Launcher Mac - Whispers of the Sword Coast (beta per tester)
          =================================================================

          1. Estrai lo zip dove vuoi.
          2. Primo avvio: right-click su WOTSCLauncherMac -> Apri (l'app non e'
             firmata da Apple: servono Apri comunque / right-click).
          3. Premi Sfoglia e scegli una cartella di prova (NON il client vero
             se ne hai uno: e' una beta).
          4. Premi Forza aggiornamento: scarica la base .7z dalla release
             GitHub e poi l'overlay Mac (WOTSC.client-mac.zip).
          5. Premi GIOCA!

          Problemi? Dal launcher usa Copia diagnostica (o il file di log) e
          invia il testo a chi sviluppa, con: modello Mac, versione macOS,
          cosa stavi facendo e l'errore visto a video.
          EOF
          rm -f "WOTSCLauncherMac-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent WOTSCLauncherMac.app Leggimi-mac.txt "WOTSCLauncherMac-${{ matrix.arch }}.zip"
          ls -la "WOTSCLauncherMac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WOTSCLauncherMac-${{ matrix.arch }}
          path: LauncherMac/dist/WOTSCLauncherMac-${{ matrix.arch }}.zip
