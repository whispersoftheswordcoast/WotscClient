name: LauncherMac
on:
  push:
    paths:
      - "LauncherMac/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "LauncherMac/**"
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m pytest LauncherMac/tests/ -v

  build-mac:
    needs: logic
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyinstaller requests pillow customtkinter pytest
      - run: python -m pytest LauncherMac/tests/ -v
      - working-directory: LauncherMac
        run: |
          # NOTA: niente --target-arch (l'interprete setup-python e' nativo
          # single-arch; universal2 qui fallirebbe la build).
          python -m PyInstaller --noconfirm --windowed \
            --name WOTSCLauncherMac \
            --osx-bundle-identifier coast.sword.wotsc-launcher-mac \
            --add-data "background.jpg:assets" \
            --add-data "exclude.ini:." \
            --add-data "mac-ignore.ini:." \
            InstallerWotscMac.py
      - run: codesign --deep --force -s - "LauncherMac/dist/WOTSCLauncherMac.app"
      - name: Contenuto dist
        working-directory: LauncherMac/dist
        run: ls -la
      - name: Leggimi player
        working-directory: LauncherMac/dist
        run: |
          printf '%s\n' \
            "WOTSC Launcher Mac - Whispers of the Sword Coast (beta per tester)" \
            "=================================================================" \
            "" \
            "1. Estrai lo zip dove vuoi." \
            "2. Primo avvio: right-click su WOTSCLauncherMac -> Apri." \
            "3. Premi Sfoglia e scegli una cartella di prova." \
            "4. Premi Forza aggiornamento, poi GIOCA!" \
            "" \
            "Problemi? Invia diagnostica e avvio.log a chi sviluppa." \
            > Leggimi-mac.txt
          ls -la Leggimi-mac.txt
      - name: Zip con ditto
        working-directory: LauncherMac/dist
        run: |
          rm -f "WOTSCLauncherMac-${{ matrix.arch }}.zip"
          /usr/bin/zip -qry "WOTSCLauncherMac-${{ matrix.arch }}.zip" WOTSCLauncherMac.app Leggimi-mac.txt
          python3 -c "import zipfile; z=zipfile.ZipFile('WOTSCLauncherMac-${{ matrix.arch }}.zip'); print('voci:', len(z.namelist())); assert z.testzip() is None; print('zip integro')"
      - uses: actions/upload-artifact@v4
        with:
          name: WOTSCLauncherMac-${{ matrix.arch }}
          path: LauncherMac/dist/WOTSCLauncherMac-${{ matrix.arch }}.zip
