[MacIgnore]
# File dell'asset base .7z (build Windows) da NON copiare su Mac.
# Skip sempre in fase merge, anche alla prima installazione.
# Supporta wildcard (*.pdb). Le dir di log utente (JournalLogs, Logs)
# sono escluse dal merge a prescindere (vedi mac_core.MERGE_SKIP_DIRS).
# UOData NON e' qui: la base porta wotsc/ con gli stessi dati (verificato:
# 288 file identici per nome, 245 hash uguali) e settings.json della base
# punta gia' a "wotsc", quindi nessuna migrazione necessaria.
files = *.pdb, *.dll, wotsc.exe, classicuo.exe, classicuo.exe.config, fna.dll.config, cuo.deps.json, cuo.runtimeconfig.json, cuo.dllc, gump.7z, minipatch.zip, spellcaster.rar, client.exe, client504cgm.exe, appdownloader.exe, large address aware.exe, owo.exe, transerv.exe, uninstall.exe, settings.json.bak, settings.sav, patchlog, uoreport0.log, upload_log.json, multicache.dat
